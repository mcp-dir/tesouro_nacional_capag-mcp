# Smithery configuration for Tesouro Nacional: Capacidade de Pagamento (CAPAG)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tesouro_nacional_capag

name: tesouro_nacional_capag-mcp
displayName: "Tesouro Nacional: Capacidade de Pagamento (CAPAG)"
description: >
  Tesouro Nacional: Capacidade de Pagamento (CAPAG), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tesouro_nacional_capag-mcp
repository: https://github.com/mcp-dir/tesouro_nacional_capag-mcp

tags:
  - tesouro_nacional_capag
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tesouro_nacional_capag

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tesouro_nacional_capag/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
